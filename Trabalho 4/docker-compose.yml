services:
  redis:
    image: redis:7.4-alpine
    container_name: trabalho4-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trabalho4

  sample-site:
    build:
      context: ./sample-site
    container_name: trabalho4-sample-site
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trabalho4

  app-python:
    build:
      context: ./services/linkextractor/step4/api
    container_name: trabalho4-app-python
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379/0
      ENABLE_CACHE: "1"
    depends_on:
      redis:
        condition: service_healthy
      sample-site:
        condition: service_healthy
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trabalho4

  app-ruby:
    build:
      context: ./services/linkextractor/step6/api
    container_name: trabalho4-app-ruby
    environment:
      PORT: 4567
      REDIS_URL: redis://redis:6379/0
      ENABLE_CACHE: "1"
    depends_on:
      redis:
        condition: service_healthy
      sample-site:
        condition: service_healthy
    ports:
      - "5002:4567"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4567/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trabalho4

  web:
    build:
      context: ./docker/web
    container_name: trabalho4-web
    environment:
      PYTHON_API_URL: http://app-python:5000/extract
      RUBY_API_URL: http://app-ruby:4567/extract
      DEFAULT_SAMPLE_URL: http://sample-site/page1.html
    depends_on:
      app-python:
        condition: service_healthy
      app-ruby:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trabalho4

  locust:
    image: locustio/locust:2.40.4
    container_name: trabalho4-locust
    working_dir: /mnt/locust
    volumes:
      - ./locust:/mnt/locust
      - ./results:/mnt/results
    depends_on:
      app-python:
        condition: service_healthy
      app-ruby:
        condition: service_healthy
    networks:
      - trabalho4

networks:
  trabalho4:
    driver: bridge